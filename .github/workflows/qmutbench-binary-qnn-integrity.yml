name: QMutBench binary QNN integrity tests

on:
  push:
    branches:
      - backup/qmutbench-binary-qnn-20261028
  pull_request:
    branches:
      - backup/qmutbench-binary-qnn-20261028
  workflow_dispatch:

jobs:
  integrity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check pytest psutil
      - name: Run QNN integrity and resume-gate tests
        run: python -m pytest -q tests/test_qmutbench_binary_qnn.py tests/test_qmutbench_resume_gate.py
