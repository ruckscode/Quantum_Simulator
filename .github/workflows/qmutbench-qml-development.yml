name: QMutBench binary QML development

on:
  push:
    branches:
      - qmutbench-remote-resume-20261030
  workflow_dispatch:
    inputs:
      reference_release_tag:
        description: Release tag containing the development split and QASM cache
        required: false
        default: qmutbench-qml-reference-dev-20261028
        type: string
      reference_bundle_sha256:
        description: SHA-256 of the reference bundle ZIP
        required: false
        default: 6fc51d1ead29da2aec38541b3d736e886aaf7041d79b55c10c4f4ddb6b2b24f9
        type: string
      training_mode:
        description: Sampled pilot or all-record disk-backed development training
        required: true
        default: full-development
        type: choice
        options:
          - sampled-pilot
          - full-development
      resume_run_id:
        description: Optional prior run ID whose QNN checkpoints should be resumed
        required: false
        type: string
      resume_run_attempt:
        description: Attempt number for the selected prior run (normally 1)
        required: false
        default: "1"
        type: string
      start_training:
        description: Begin or continue bounded QNN updates after all validations pass
        required: true
        default: false
        type: boolean
      campaign_start_run_id:
        description: Internal idempotent artifact-retention boundary for campaign continuations
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: qmutbench-binary-qml-development
  cancel-in-progress: false

jobs:
  train:
    # GitHub documents 16 GiB RAM for public standard runners and 8 GiB for private standard runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out this project
        uses: actions/checkout@v6

      - name: Check out pinned public QMutBench source
        uses: actions/checkout@v6
        with:
          repository: EnautMendi/QMutBench
          ref: 01f5e7700c051fe715fc368b307deaa7e6869ba8
          path: data/qmutbench_full
          sparse-checkout: |
            /data/all_data.csv
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: qmutbench_qml/requirements-lock.txt

      - name: Install locked QML environment
        run: python -m pip install -r qmutbench_qml/requirements-lock.txt

      - name: Run QML pipeline integrity tests before training
        run: >-
          python -m pytest -q
          tests/test_qmutbench_binary_qnn.py
          tests/test_qmutbench_streaming.py
          tests/test_qmutbench_qasm_mutation_diff.py

      - name: Record runner resources
        shell: bash
        run: |
          mkdir -p reports/experiments
          python - <<'PY'
          import json, os, psutil, shutil
          out = "reports/experiments/qmutbench_binary_qnn_resources.json"
          v = psutil.virtual_memory()
          with open(out, "w", encoding="utf-8") as f:
              json.dump({"total_ram_bytes": v.total, "available_ram_bytes": v.available,
                         "available_ram_mib": v.available // 2**20,
                         "disk_free_bytes": shutil.disk_usage(os.getcwd()).free,
                         "cpu_count": os.cpu_count()}, f, indent=2)
          print(open(out, encoding="utf-8").read())
          if v.available // 2**20 < 2048:
              raise SystemExit("Hosted runner has less than the QML startup RAM requirement (2048 MiB)")
          PY

      - name: Download and verify development reference bundle
        env:
          RELEASE_TAG: ${{ inputs.reference_release_tag || 'qmutbench-qml-reference-dev-20261028' }}
          BUNDLE_SHA256: ${{ inputs.reference_bundle_sha256 || '6fc51d1ead29da2aec38541b3d736e886aaf7041d79b55c10c4f4ddb6b2b24f9' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p .qml-input
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$BUNDLE_SHA256" == "6fc51d1ead29da2aec38541b3d736e886aaf7041d79b55c10c4f4ddb6b2b24f9" ]]
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern qmutbench_qml_reference_dev_bundle.zip --dir .qml-input
          mv .qml-input/qmutbench_qml_reference_dev_bundle.zip .qml-input/reference_bundle.zip
          echo "$BUNDLE_SHA256  .qml-input/reference_bundle.zip" | sha256sum --check --status
          echo "reference_bundle_sha256=$BUNDLE_SHA256" >> "$GITHUB_STEP_SUMMARY"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern qmutbench_qml_qasm_dev_cache_20261028.zip --dir .qml-input
          echo "d6ad2d5f8416a93b62cb195d4f06c2c44f61bba24a309f5be754337efcf7791f  .qml-input/qmutbench_qml_qasm_dev_cache_20261028.zip" | sha256sum --check --status
          mkdir -p data/qmutbench_ml
          unzip -oq .qml-input/qmutbench_qml_qasm_dev_cache_20261028.zip -d data/qmutbench_ml

      - name: Restore checkpoints from prior workflow run
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: qmutbench-qml-development-${{ inputs.resume_run_id }}-${{ inputs.resume_run_attempt }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: .qmb-output

      - name: Decrypt and verify prior run artifact
        if: ${{ inputs.resume_run_id != '' }}
        env:
          QMB_SEED_AES256_KEY: ${{ secrets.QMB_SEED_AES256_KEY }}
        run: |
          if [[ -z "$QMB_SEED_AES256_KEY" ]]; then
            echo "Required Actions secret QMB_SEED_AES256_KEY is missing." >&2
            exit 1
          fi
          printf '%s' "$QMB_SEED_AES256_KEY" > "$RUNNER_TEMP/qmb-seed-key"
          chmod 600 "$RUNNER_TEMP/qmb-seed-key"
          python -m qmutbench_qml.training.seed_bundle open-directory \
            --encrypted .qmb-output/qmutbench_run_artifact.enc \
            --output "$RUNNER_TEMP/qmb-run" \
            --key-file "$RUNNER_TEMP/qmb-seed-key"
          output=reports/experiments/qmutbench_binary_qnn_full_development_chunk16_20261029
          if [[ -e "$output" ]]; then
            echo "Refusing to overwrite an existing campaign output directory." >&2
            exit 1
          fi
          mkdir -p reports/experiments
          cp -a "$RUNNER_TEMP/qmb-run/reports/experiments/qmutbench_binary_qnn_full_development_chunk16_20261029" reports/experiments/
          previous_smoke=$(find "$RUNNER_TEMP/qmb-run/reports/experiments/qmutbench_binary_qnn_smoke" -mindepth 1 -maxdepth 1 -type d -print -quit 2>/dev/null || true)
          if [[ -n "$previous_smoke" ]]; then
            mkdir -p reports/experiments/qmutbench_binary_qnn_smoke
            cp -a "$previous_smoke" reports/experiments/qmutbench_binary_qnn_smoke/
          fi
          rm -f "$RUNNER_TEMP/qmb-seed-key"

      - name: Reject stale duplicate continuation input
        if: ${{ inputs.resume_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/qmutbench-qml-development.yml/runs?branch={os.environ['REF_NAME']}&per_page=100"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"})
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response)["workflow_runs"]
          parent, current = int(os.environ["RESUME_RUN_ID"]), int(os.environ["RUN_ID"])
          stale = [run["id"] for run in runs if run["id"] not in (parent, current)
                   and parent < run["id"] < current and run["head_branch"] == os.environ["REF_NAME"]]
          if stale:
              raise SystemExit(f"Rejecting stale continuation input; newer workflow run(s) already exist: {stale}")
          print("Continuation input is current; no newer sibling workflow run exists.")
          PY

      - name: Decrypt and verify checkpoint 371 seed
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id == '' }}
        env:
          QMB_SEED_AES256_KEY: ${{ secrets.QMB_SEED_AES256_KEY }}
          QMB_SEED_SHA256: 677ab055e8c3564fdf8b43f4483fc35a233625ac0a95152f3a424cf414c8ca44
        run: |
          if [[ -z "$QMB_SEED_AES256_KEY" ]]; then
            echo "Required Actions secret QMB_SEED_AES256_KEY is missing." >&2
            exit 1
          fi
          printf '%s' "$QMB_SEED_AES256_KEY" > "$RUNNER_TEMP/qmb-seed-key"
          chmod 600 "$RUNNER_TEMP/qmb-seed-key"
          python -m qmutbench_qml.training.seed_bundle open \
            --encrypted .github/qmutbench/checkpoint371.enc \
            --output "$RUNNER_TEMP/qmb-seed" \
            --key-file "$RUNNER_TEMP/qmb-seed-key" \
            --sha256 "$QMB_SEED_SHA256"
          output=reports/experiments/qmutbench_binary_qnn_full_development_chunk16_20261029
          if [[ -e "$output" ]]; then
            echo "Refusing to overwrite an existing checkpoint seed directory." >&2
            exit 1
          fi
          mkdir -p "$output"
          cp -a "$RUNNER_TEMP/qmb-seed/." "$output/"
          rm -f "$RUNNER_TEMP/qmb-seed-key"

      - name: Require a successful read-only resume validation before training
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.start_training == true && inputs.resume_run_id != '' }}
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("reports/experiments/qmutbench_binary_qnn_full_development_chunk16_20261029/remote_resume_validation.json")
          if not path.is_file():
              raise SystemExit("No read-only resume validation artifact exists. Validate the seed first, then dispatch training from that encrypted run artifact.")
          marker = json.loads(path.read_text(encoding="utf-8"))
          result = marker.get("validation", {})
          if (marker.get("schema") != "qmutbench-remote-resume-validation-v1" or
                  marker.get("validated_commit") != __import__("os").environ["SOURCE_COMMIT"] or
                  marker.get("seed_checkpoint_sha256") != "928cbbef8dc42afe43059dc8bff016aaa3b2f37370dc3440751d040444589298" or
                  result.get("status") != "resume_validated_read_only" or
                  result.get("checkpoint_directory_unchanged") is not True or
                  result.get("frozen_test_accessed") is not False or
                  not result.get("checkpoint_fingerprint") or
                  result.get("chunks_verified", 0) < 1):
              raise SystemExit("Read-only resume validation marker is stale or incomplete; no QNN update will start.")
          print("Read-only checkpoint/source/split validation marker is current; training gate passed.")
          PY

      - name: Install pinned metadata and development-only folds
        run: >-
          python -m qmutbench_qml.training.prepare_actions_inputs
          --source-csv data/qmutbench_full/data/all_data.csv
          --official-checkout data/qmutbench_full
          --bundle .qml-input/reference_bundle.zip

      - name: Validate cached development-only QASM feature inputs
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("data/qmutbench_ml/qasm_mutation_diff_v1")
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected = {"qasm_commit": "01f5e7700c051fe715fc368b307deaa7e6869ba8",
                      "source_sha256": "3f4547868673c583f047cee19d27c7bc97c64f15bb0586098ada778a3a0ff778",
                      "development_rows": 578117, "feature_rows": 578117,
                      "error_rows": 0, "status": "complete"}
          if any(manifest.get(k) != v for k, v in expected.items()):
              raise SystemExit("QASM feature cache provenance or coverage mismatch")
          for part in manifest["chunks"]:
              path = root / part["file"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != part["sha256"] or part["errors"] != 0:
                  raise SystemExit(f"QASM feature chunk failed checksum/error validation: {path}")
          if sum(part["rows"] for part in manifest["chunks"]) != 578117:
              raise SystemExit("QASM feature cache does not cover every development record")
          print(f"Validated {len(manifest['chunks'])} development-only QASM chunks.")
          PY

      - name: Validate campaign configuration
        env:
          TRAINING_MODE: ${{ inputs.training_mode || 'full-development' }}
        run: python -m qmutbench_qml.training.run_binary_development --mode "$TRAINING_MODE" --validate-config

      - name: Verify real circuit gradient, update, and checkpoint recovery
        run: >-
          python -m qmutbench_qml.training.run_binary_smoke
          --output reports/experiments/qmutbench_binary_qnn_smoke/${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run selected origin-grouped campaign with chunk-resumable QNN updates
        id: campaign
        shell: bash
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          TRAINING_MODE: ${{ inputs.training_mode || 'full-development' }}
          START_TRAINING: ${{ inputs.start_training || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if [[ "$TRAINING_MODE" == "full-development" ]]; then
            output=reports/experiments/qmutbench_binary_qnn_full_development_chunk16_20261029
          else
            output=reports/experiments/qmutbench_binary_qnn_sampled_pilot
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "campaign_status=branch_checks_only" >> "$GITHUB_OUTPUT"
            echo "Push validation does not import a checkpoint or start training."
            exit 0
          fi
          if [[ "$TRAINING_MODE" != "full-development" ]]; then
            echo "This dedicated checkpoint workflow supports only full-development." >&2
            exit 1
          fi
          validate_resume() {
            validation="$RUNNER_TEMP/qmb-resume-validation.json"
            python -m qmutbench_qml.training.run_binary_development \
              --mode full-development --chunk-batches 16 --output "$output" --validate-resume > "$validation"
            python - "$validation" "$output/remote_resume_validation.json" "$SOURCE_COMMIT" <<'PY'
          import json, sys
          from pathlib import Path
          validation = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          marker_path = Path(sys.argv[2])
          prior = json.loads(marker_path.read_text(encoding="utf-8")) if marker_path.exists() else {}
          marker = {"schema": "qmutbench-remote-resume-validation-v1",
                    "validated_commit": sys.argv[3],
                    "seed_checkpoint_sha256": prior.get("seed_checkpoint_sha256", validation["checkpoint_sha256"]),
                    "validation": validation}
          marker_path.write_text(json.dumps(marker, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          }
          if [[ "$START_TRAINING" != "true" || -z "$RESUME_RUN_ID" ]]; then
            validate_resume
          fi
          if [[ "$START_TRAINING" != "true" ]]; then
            echo "campaign_status=validated_only" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(--mode "$TRAINING_MODE" --output "$output")
          args+=(--resume)
          if [[ "$TRAINING_MODE" == "full-development" ]]; then
            args+=(--chunk-batches 16)
            args+=(--max-chunks-per-invocation 64)
          fi
          python -m qmutbench_qml.training.run_binary_development "${args[@]}"
          if [[ "$TRAINING_MODE" == "full-development" ]]; then
            python - <<'PY'
          import json, os
          path = "reports/experiments/qmutbench_binary_qnn_full_development_chunk16_20261029/full_campaign_manifest.json"
          with open(path, encoding="utf-8") as stream:
              status = json.load(stream)["status"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"campaign_status={status}\n")
          PY
          else
            echo "campaign_status=completed_sampled_pilot" >> "$GITHUB_OUTPUT"
          fi

      - name: Record post-run resources
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, psutil, shutil
          path = "reports/experiments/qmutbench_binary_qnn_resources.json"
          os.makedirs(os.path.dirname(path), exist_ok=True)
          try:
              with open(path, encoding="utf-8") as f: report = json.load(f)
          except FileNotFoundError:
              report = {}
          v = psutil.virtual_memory()
          report["after"] = {"total_ram_bytes": v.total,
                             "available_ram_bytes": v.available,
                             "available_ram_mib": v.available // 2**20,
                             "disk_free_bytes": shutil.disk_usage(os.getcwd()).free,
                             "cpu_count": os.cpu_count()}
          with open(path, "w", encoding="utf-8") as f: json.dump(report, f, indent=2)
          PY

      - name: Update resumable progress record
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_COMMIT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id || '' }}
          CAMPAIGN_STATUS: ${{ steps.campaign.outputs.campaign_status || 'not_started' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("reports/experiments")
          output = root / "qmutbench_binary_qnn_full_development_chunk16_20261029"
          output.mkdir(parents=True, exist_ok=True)
          manifest_path = output / "full_campaign_manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8")) if manifest_path.exists() else {}
          resource_path = root / "qmutbench_binary_qnn_resources.json"
          resources = json.loads(resource_path.read_text(encoding="utf-8")) if resource_path.exists() else {}
          record = {
              "schema": "qmutbench-remote-progress-v1",
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_event": os.environ["EVENT_NAME"],
              "branch": os.environ["REF_NAME"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "previous_run_id": int(os.environ["RESUME_RUN_ID"]) if os.environ["RESUME_RUN_ID"] else None,
              "status": manifest.get("status", os.environ["CAMPAIGN_STATUS"]),
              "active_fold": manifest.get("active_fold"),
              "active_chunk": manifest.get("active_chunk"),
              "completed_folds": manifest.get("completed_folds", []),
              "total_chunks_committed": manifest.get("total_chunks_committed", 0),
              "total_optimizer_updates": manifest.get("total_optimizer_updates", 0),
              "total_qnn_records_processed": manifest.get("total_qnn_records_processed", 0),
              "frozen_test_accessed": manifest.get("frozen_test_accessed", False),
              "resource_measurements": resources,
              "resume_seed_sha256": "677ab055e8c3564fdf8b43f4483fc35a233625ac0a95152f3a424cf414c8ca44",
              "next_action": "automatically dispatch from this encrypted artifact" if os.environ["CAMPAIGN_STATUS"] == "paused_checkpointed" else "validation or diagnosis required"
          }
          path = output / "remote_execution_state.json"
          path.write_text(json.dumps(record, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
              stream.write(f"### QMutBench resumable progress\n\n")
              stream.write(f"Run `{record['workflow_run_id']}` / attempt `{record['workflow_run_attempt']}`; status `{record['status']}`.\n\n")
              stream.write(f"Fold `{record['active_fold']}`, chunk `{record['active_chunk']}`; committed {record['total_chunks_committed']} chunks and {record['total_optimizer_updates']} optimizer updates.\n\n")
              stream.write(f"Frozen test accessed: `{record['frozen_test_accessed']}`.\n")
          print(json.dumps({k: record[k] for k in ("workflow_run_id", "status", "active_fold", "active_chunk", "total_chunks_committed", "total_optimizer_updates", "frozen_test_accessed")}, sort_keys=True))
          PY

      - name: Encrypt run outputs before artifact upload
        if: always()
        env:
          QMB_SEED_AES256_KEY: ${{ secrets.QMB_SEED_AES256_KEY }}
        run: |
          if [[ -z "$QMB_SEED_AES256_KEY" || ! -d reports/experiments/qmutbench_binary_qnn_full_development_chunk16_20261029 ]]; then
            echo "No authenticated key or campaign output directory; no plaintext artifact will be uploaded."
            exit 0
          fi
          printf '%s' "$QMB_SEED_AES256_KEY" > "$RUNNER_TEMP/qmb-seed-key"
          chmod 600 "$RUNNER_TEMP/qmb-seed-key"
          mkdir -p .qmb-output
          stage="$RUNNER_TEMP/qmb-run-plain"
          if [[ -e "$stage" ]]; then
            echo "Refusing to overwrite a pre-existing temporary artifact staging directory." >&2
            exit 1
          fi
          mkdir -p "$stage/reports/experiments"
          cp -a reports/experiments/qmutbench_binary_qnn_full_development_chunk16_20261029 "$stage/reports/experiments/"
          smoke="reports/experiments/qmutbench_binary_qnn_smoke/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -d "$smoke" ]]; then cp -a "$smoke" "$stage/reports/experiments/qmutbench_binary_qnn_smoke/"; fi
          python -m qmutbench_qml.training.seed_bundle seal-directory \
            --source "$stage" \
            --output .qmb-output/qmutbench_run_artifact.enc \
            --key-file "$RUNNER_TEMP/qmb-seed-key"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          artifact = Path(".qmb-output/qmutbench_run_artifact.enc")
          record_path = Path("reports/experiments/qmutbench_binary_qnn_full_development_chunk16_20261029/remote_execution_state.json")
          record = json.loads(record_path.read_text(encoding="utf-8"))
          record["latest_artifact_sha256"] = hashlib.sha256(artifact.read_bytes()).hexdigest()
          Path(".qmb-output/remote_execution_state.json").write_text(json.dumps(record, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          rm -f "$RUNNER_TEMP/qmb-seed-key"

      - name: Upload logs, checkpoints, predictions, and evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qmutbench-qml-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qmb-output/
          if-no-files-found: warn
          retention-days: 7

      - name: Retain the two newest verified artifacts from this campaign
        if: ${{ success() && inputs.start_training == true && steps.campaign.outputs.campaign_status == 'paused_checkpointed' && inputs.training_mode == 'full-development' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CAMPAIGN_START_RUN_ID: ${{ inputs.campaign_start_run_id || '' }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          repo = os.environ["REPOSITORY"]
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          base = f"https://api.github.com/repos/{repo}/actions/artifacts"
          run_id, attempt = int(os.environ["RUN_ID"]), os.environ["RUN_ATTEMPT"]
          start_id = int(os.environ["CAMPAIGN_START_RUN_ID"] or run_id)
          current_name = f"qmutbench-qml-development-{run_id}-{attempt}"
          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.status, (json.load(response) if method == "GET" else None)
          artifacts = []
          for page in range(1, 21):
              status, body = request(f"{base}?per_page=100&page={page}")
              artifacts.extend(body["artifacts"])
              if len(body["artifacts"]) < 100: break
          current = next((item for item in artifacts if item["name"] == current_name
                          and item.get("workflow_run", {}).get("id") == run_id
                          and not item.get("expired")), None)
          if current is None:
              raise SystemExit("Current encrypted run artifact is not present; retaining all prior artifacts.")
          campaign = [item for item in artifacts if item["name"].startswith("qmutbench-qml-development-")
                      and item.get("workflow_run", {}).get("head_branch") == os.environ["REF_NAME"]
                      and int(item.get("workflow_run", {}).get("id", 0)) >= start_id
                      and not item.get("expired")]
          campaign.sort(key=lambda item: (item["created_at"], item["id"]), reverse=True)
          keep = {item["id"] for item in campaign[:2]} | {current["id"]}
          obsolete = [item for item in campaign if item["id"] not in keep]
          for item in obsolete:
              last_error = None
              for attempt_no in range(3):
                  try:
                      request(f"{base}/{item['id']}", method="DELETE")
                      last_error = None
                      break
                  except Exception as error:
                      last_error = error
                      if attempt_no < 2: time.sleep(2 ** (attempt_no + 1))
              if last_error is not None:
                  raise SystemExit(f"Artifact cleanup stopped after bounded retries; newest artifacts remain intact ({type(last_error).__name__}).")
          print(f"Verified current artifact; retained {len(keep)} newest campaign recovery artifacts and preserved pre-campaign history.")
          PY

      - name: Continue from this run's verified checkpoint artifact
        if: ${{ success() && inputs.start_training == true && steps.campaign.outputs.campaign_status == 'paused_checkpointed' && inputs.training_mode == 'full-development' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CAMPAIGN_START_RUN_ID: ${{ inputs.campaign_start_run_id || github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repository = os.environ["REPOSITORY"]
          payload = {
              "ref": os.environ["REF_NAME"],
              "inputs": {
                  "reference_release_tag": "qmutbench-qml-reference-dev-20261028",
                  "reference_bundle_sha256": "6fc51d1ead29da2aec38541b3d736e886aaf7041d79b55c10c4f4ddb6b2b24f9",
                  "training_mode": "full-development",
                  "start_training": True,
                  "campaign_start_run_id": os.environ["CAMPAIGN_START_RUN_ID"],
                  "resume_run_id": os.environ["RUN_ID"],
                  "resume_run_attempt": os.environ["RUN_ATTEMPT"],
              },
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/workflows/qmutbench-qml-development.yml/dispatches",
              data=json.dumps(payload).encode(), method="POST",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28",
                       "Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise RuntimeError(f"workflow dispatch returned HTTP {response.status}")
          print("Dispatched a resumable full-development run from this run's artifact.")
          PY
